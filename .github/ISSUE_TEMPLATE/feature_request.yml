name: 需求建议
description: 建议新增功能，或告诉我们哪些地方可以改得更好。
labels: [enhancement]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: 你希望 YeImageViewer 增加或改进什么？
      placeholder: 简单说说你希望怎样操作、看到什么结果。可以附截图或参考示例。
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      placeholder: 你在什么情况下会用到它？现在是怎样处理的？
